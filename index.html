<!DOCTYPE html>
<html lang="zh-HK" data-font="md">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C8372D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="每日腦點心" />
  <meta name="description" content="每日腦點心 Daily MindSum — 港溫長者及家人一齊玩嘅醒神早茶健腦遊戲 (記憶、時事、心算、歷史、成語、眼力)" />
  <title>每日腦點心 · Daily MindSum</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon-64.png?v=15" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=15" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=15" />
  <link rel="manifest" href="./manifest.webmanifest?v=15" />
  <link rel="stylesheet" href="./styles/main.css?v=15" />
</head>
<body>
  <div class="app-shell">
    <!-- Sticky Accessible Header -->
    <header class="top-bar" role="banner">
      <div class="brand" id="brandHomeBtn" role="button" tabindex="0" aria-label="Go Home">
        <img src="./assets/icon-192.png?v=15" alt="阿喵 Mochi" class="brand-logo" />
        <div class="brand-titles">
          <span class="brand-main" data-i18n="appTitle">每日腦點心</span>
          <span class="brand-sub" data-i18n="appSubtitle">Daily MindSum · 港×溫早茶</span>
        </div>
      </div>

      <div class="top-controls">
        <button type="button" class="chip-btn" id="langToggleBtn" title="Switch Language / 切換語言">
          <span id="langLabel">EN</span>
        </button>
        <button type="button" class="chip-btn" id="fontCycleBtn" title="Font Size / 字體大小">
          <span id="fontLabel">字 A+</span>
        </button>
        <button type="button" class="chip-btn icon-only" id="soundToggleBtn" title="Sound / 音效" aria-label="Toggle Sound">
          <span id="soundIcon">🔔</span>
        </button>
        <button type="button" class="chip-btn icon-only" id="settingsHeaderBtn" title="Settings / 偏好設定" aria-label="Settings">
          <span>⚙️</span>
        </button>
        <button type="button" class="profile-pill" id="profileHeaderBtn">
          <span id="headerAvatar">🫖</span>
          <span id="headerUserLabel">茶客</span>
        </button>
      </div>
    </header>

    <!-- Dual HK & Vancouver Time & Region Filter Bar -->
    <div class="city-strip">
      <div class="clocks" id="dualClocks" aria-live="polite">
        <span>🇭🇰 <strong id="hkClock">--:--</strong></span>
        <span class="dot-sep">·</span>
        <span>🇨🇦 <strong id="yvrClock">--:--</strong></span>
      </div>
      <div class="region-pills" role="group" aria-label="Region Focus">
        <button type="button" class="region-pill active" data-region="both" id="regBothBtn">港×溫</button>
        <button type="button" class="region-pill" data-region="hk" id="regHkBtn">🇭🇰 香港</button>
        <button type="button" class="region-pill" data-region="yvr" id="regYvrBtn">🇨🇦 溫哥華</button>
      </div>
    </div>

    <!-- Invite Banner (shown when opened via ?invite=... link) -->
    <div id="inviteBanner" class="invite-banner hidden" role="region" aria-label="Game Invitation"></div>

    <!-- Main Dynamic View Area -->
    <main id="mainContent" class="main-content" tabindex="-1"></main>

    <!-- Bottom Tab Bar (Large Senior-Friendly Touch Targets) -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <button type="button" class="nav-tab active" data-tab="home">
        <span class="nav-icon">🫖</span>
        <span class="nav-label" data-i18n="navHome">今日早茶</span>
      </button>
      <button type="button" class="nav-tab" data-tab="games">
        <span class="nav-icon">🀄</span>
        <span class="nav-label" data-i18n="navGames">自選點心</span>
      </button>
      <button type="button" class="nav-tab" data-tab="leaderboard">
        <span class="nav-icon">🏆</span>
        <span class="nav-label" data-i18n="navBoard">龍虎榜</span>
      </button>
      <button type="button" class="nav-tab" data-tab="album">
        <span class="nav-icon">🎁</span>
        <span class="nav-label" data-i18n="navAlbum">珍藏圖鑑</span>
      </button>
    </nav>
  </div>

  <!-- Nintendo Title / Play Starting Screen -->
  <div id="startScreenOverlay" class="start-screen-overlay hidden" role="dialog" aria-modal="true" aria-label="Daily MindSum Title Screen"></div>

  <!-- Modal Container (Welcome Tour, Settings, Profile/Auth, Family Photos, Firebase Info) -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <!-- Toast Feedback -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js?v=15"></script>
</body>
</html>

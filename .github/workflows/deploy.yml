name: Deploy Daily MindSum to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Runs daily at 13:15 UTC (21:15 Hong Kong / 05:15–06:15 Vancouver) to refresh daily news!
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch Fresh HK & Vancouver News Briefs
        run: python3 scripts/update_daily_news.py

      - name: Prepare Static Site Bundle
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets styles js data _site/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"

  deploy:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
